name: "Docs: Build & Upload to R2"

on:
  push:
    branches: [staging, main]

# Serialize deploys per branch. Two pushes in quick succession would otherwise
# run concurrent sync jobs into the same R2 prefix, where each build's prune
# removes the other's freshly-uploaded chunks, producing a deploy with one
# build's HTML and another's assets (404'd JS).
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounded so a hang reports rather than burning the runner. With no
    # `timeout-minutes` a job inherits GitHub's 360-minute default, and a
    # step that wedges on a network call takes six hours to say nothing.
    # Sized well above the observed maximum (about 7 minutes: full clone, build, R2 upload), because a cap that trips
    # on a slow-but-working run gets raised and then removed.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `showLastUpdateTime` derives each page's date from
          # git. A shallow clone gives every page the same date, and reports
          # nothing -- the build succeeds and the dates are quietly wrong.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Set environment
        id: env
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          echo "base_url=docs" >> "$GITHUB_OUTPUT"
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "prod=" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: yarn build
        env:
          PROD: ${{ steps.env.outputs.prod }}

      - name: Restructure build output
        env:
          BASE_URL: ${{ steps.env.outputs.base_url }}
        run: |
          mv build build-raw
          mkdir -p "build/${BASE_URL}"
          mv build-raw/* "build/${BASE_URL}/"
          rm -rf build-raw
          cp "build/${BASE_URL}/404.html" build/404.html

      # THERE WAS A `/${BASE_URL}/*.js` RULE HERE AND IT IS DELETED. 2026-09-04.
      #
      # It overlapped BOTH of the rules that remain, and the second overlap is
      # the one worth remembering.
      #
      # Against `/docs/assets/*` it doubled a value that agreed with itself:
      # `/docs/assets/js/main.<hash>.js` matched both, and because `_headers` is
      # not first-match-wins -- every matching rule applies and a repeated
      # header name APPENDS -- staging served:
      #
      #   cache-control: public, max-age=31536000, immutable, public, max-age=31536000, immutable
      #
      # Measured by MarketData-App/www-marketdata-app on staging. Production
      # never showed it, because the orchestrator's scripts/cache-headers.mjs
      # rewrites Cache-Control there and that rewrite is production-only. So it
      # was invisible from this repository in the environment we look at least.
      #
      # Against `/docs/img/*` it overlapped on any `.js` under `/docs/img/`,
      # where the two values DISAGREED -- a month against an immutable year.
      # No such file exists, so nothing was ever doubled there; the first one
      # to appear would have been served both, and which wins is undefined.
      # Found by `www-marketdata-app` after the deletion had already removed it.
      #
      # DELETED RATHER THAN FIXED WITH `! Cache-Control`, which was the proposed
      # fix and would also have worked. Two reasons it is the weaker one:
      #
      #   1. The rule matched NOTHING the assets rule did not already cover.
      #      Every .js in the build is under `assets/js` -- verified, and
      #      `static/` holds none. An unset-then-set rule would exist only to
      #      undo and redo what the line above it had just done.
      #   2. It was a latent hazard, not merely redundant. Assets are safe to
      #      mark `immutable` for a year because their filenames are
      #      content-hashed. A file dropped into `static/` is NOT: it would ship
      #      as `/docs/foo.js`, match this rule, and be pinned in every
      #      browser's cache for a year with no way to publish a correction.
      #
      # So a .js outside `assets/` now inherits the default rather than an
      # immutable year, which is the safe direction for an unhashed name.
      #
      # The last rule is the build sentinel, and it is the reason to read this
      # step carefully before adding another.
      #
      # A CACHED SENTINEL IS WORSE THAN NO SENTINEL: it answers about a previous
      # deploy while looking authoritative. Hence `no-store`.
      #
      # `_headers` is NOT first-match-wins. Every matching rule applies and a
      # repeated header name APPENDS, so two rules matching build-info.json
      # would serve two Cache-Control values and `no-store` is not obviously the
      # winner. Neither rule above it matches: `/assets/*` and `/img/*` are
      # different prefixes. So it stands alone.
      #
      # A broad rule added here, or in the website half the orchestrator
      # concatenates with, would break that. The fix if it ever happens is the
      # one that repo already worked out for the canonical `Link`: `! Cache-Control`
      # in the specific rule, unsetting before setting, broad rule first --
      # which is also the shape `www-marketdata-app`'s merge-time gate (#25,
      # 85e5841) asks for by name. That gate now fails a deploy, in both
      # environments, when any path would take one header name from two rules.
      # So a fourth rule that overlaps one of these three is a loud deploy
      # failure naming both paths, rather than a doubled header nobody sees.
      - name: Generate cache headers
        env:
          BASE_URL: ${{ steps.env.outputs.base_url }}
        run: |
          printf '%s\n' \
            "/${BASE_URL}/assets/*" \
            "  Cache-Control: public, max-age=31536000, immutable" \
            "" \
            "/${BASE_URL}/img/*" \
            "  Cache-Control: public, max-age=2592000" \
            "" \
            "/${BASE_URL}/build-info.json" \
            "  Cache-Control: no-store" \
            > build/_headers

      # UPLOAD, THEN PRUNE, THEN PROVE IT. Not `aws s3 sync --delete`.
      #
      # This was one `aws s3 sync build/ ... --delete`, and it was silently
      # deleting pages it had just uploaded. #188.
      #
      # In the production run of 2026-08-25 (32891982296), 210 keys appear in
      # that step's log as BOTH an upload and a delete. `aws s3 sync` runs the
      # two through one concurrent queue, so for each of those keys the outcome
      # was whichever request R2 committed last. 18 deletes landed after their
      # own upload, and 16 of those pages were still 404 on production twelve
      # days later -- every one of the 15 in #188, plus one more that appeared
      # after it was filed. The gaps were 30-125 ms, which is why the set drifts
      # from deploy to deploy and why staging and production lost different
      # pages from identical builds.
      #
      # The trigger was ours. Before plugins/markdown-twins.js landed on
      # 2026-08-25 no build wrote a file beside a directory of the same stem;
      # the twins added `<stem>.md` next to `<stem>/`, and the delete count in
      # this step went from 0 on every prior run to ~220 on every run since.
      # The comparator disagreeing with R2's key listing over those stems is
      # the part that cannot be instrumented from here without bucket
      # credentials -- but it does not need to be, because nothing below asks
      # `aws s3 sync` to decide what to delete.
      #
      # So: sync WITHOUT --delete, which cannot remove anything; then compute
      # the stale set here, from two explicit lists, where a key the build
      # produced can never appear; then re-list and assert that every built
      # file is really in R2. That last step is the one that would have caught
      # #188 on the day it started, on staging, before production.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REGION: auto
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          BUCKET: www-marketdata-app-builds
        run: |
          set -euo pipefail
          PREFIX="${ENVIRONMENT}/sources/docs"

          list_remote() {
            aws s3api list-objects-v2 \
              --bucket "$BUCKET" --prefix "${PREFIX}/" \
              --query 'Contents[].Key' --output text \
              | tr '\t' '\n' \
              | sed -e "s|^${PREFIX}/||" -e '/^None$/d' -e '/^[[:space:]]*$/d' \
              | LC_ALL=C sort
          }

          ( cd build && find . -type f -printf '%P\n' ) | LC_ALL=C sort > local-keys.txt
          local_n=$(wc -l < local-keys.txt)

          # An empty build must never reach the prune below, which would read it
          # as "every key in R2 is stale" and empty the prefix.
          if [ "$local_n" -eq 0 ]; then
            echo "::error::build/ contains no files; refusing to sync or prune ${PREFIX}"
            exit 1
          fi
          echo "build produced ${local_n} file(s)"

          # --- 1. upload. No --delete: this pass cannot remove anything. -----
          aws s3 sync build/ "s3://${BUCKET}/${PREFIX}/"

          # --- 2. prune, from a set this script computes ---------------------
          list_remote > remote-keys.txt
          comm -13 local-keys.txt remote-keys.txt > stale-keys.txt
          stale_n=$(wc -l < stale-keys.txt)
          remote_n=$(wc -l < remote-keys.txt)
          echo "remote holds ${remote_n} key(s); ${stale_n} stale"

          # A prune this large is a bug in this script, not a release that
          # deleted a quarter of the site.
          if [ "$stale_n" -gt 20 ] && [ "$stale_n" -gt $(( remote_n / 4 )) ]; then
            echo "::error::prune would delete ${stale_n} of ${remote_n} key(s); refusing"
            sed -n '1,40p' stale-keys.txt
            exit 1
          fi

          while IFS= read -r key; do
            [ -n "$key" ] || continue
            aws s3 rm "s3://${BUCKET}/${PREFIX}/${key}"
          done < stale-keys.txt

          # --- 3. prove the prefix now matches the build --------------------
          list_remote > remote-after.txt
          comm -23 local-keys.txt remote-after.txt > lost-keys.txt
          lost_n=$(wc -l < lost-keys.txt)
          if [ "$lost_n" -ne 0 ]; then
            echo "::error::${lost_n} of ${local_n} built file(s) are missing from ${PREFIX} after the sync"
            sed -n '1,50p' lost-keys.txt
            exit 1
          fi

          # "${local_n} of ${local_n}" is only meaningful because the zero case
          # exited above. A check that can print "0 of 0" and pass is the defect
          # it is supposed to catch.
          echo "verified ${local_n} of ${local_n} built file(s) present in ${PREFIX}"

      - name: Notify orchestrator
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          # A LITERAL, and deliberately not owner-relative. The orchestrator moved
          # to the MarketData-App ORG on 2026-08-28; this repo stayed on the
          # MarketDataApp USER account, because it is public and public repos have
          # unlimited Actions. So the two live under different owners and
          # `${{ github.repository_owner }}` would resolve to the wrong one here.
          #
          # (MarketData-App/website CAN use the owner-relative form, because it
          # moved with the orchestrator. Same dispatch, different answer, because
          # of where each repo lives.)
          #
          # `repository_dispatch` does NOT follow GitHub's transfer redirect the
          # way `git` does, so the old path did not fail over -- it would simply
          # have 404ed on the next docs deploy, after a clean build and upload.
          repository: MarketData-App/www-marketdata-app
          event-type: site-built
          # `source_repo` is derived, never a literal: the orchestrator dispatches
          # `deploy-complete` back to whatever this names, and post-deploy-tests.yml
          # listens for it. A stale literal after a transfer routes that event to
          # the old path with no error anywhere, and the post-deploy verification
          # silently stops running.
          #
          # NOTE the block below is JSON, not YAML. `#` is a syntax error in it,
          # not a comment -- which is why these lines are up here. Putting four
          # of them inside the equivalent block in MarketData-App/website on
          # 2026-08-28 failed that dispatch after a clean build, sync and reconcile.
          client-payload: >-
            {
              "source": "docs",
              "source_repo": "${{ github.repository }}",
              "environment": "${{ steps.env.outputs.environment }}",
              "commit_sha": "${{ github.sha }}"
            }

      # The "Check if Worker changed" / "Test Worker" / "Deploy Worker" steps
      # were here. The edge worker moved to MarketDataApp/www-marketdata-app,
      # which owns the unified host, and that repo deploys it from its own
      # worker.yml. It was deployed from there for the first time on
      # 2026-08-25 (version 3656d1ba) and verified live on both hosts before
      # these steps were removed, so there was never a window with no deployer.
      #
      # This job now does one thing: build the docs and upload them to R2.
      #
      # NOTE FOR WHOEVER MERGES staging INTO main. Until that merge lands, main
      # still carries these steps and a worker/ directory. A push to main would
      # redeploy the worker from here and overwrite the orchestrator's version.
      # The code is the same, so the harm is a confusing version history rather
      # than an outage -- but merge promptly and do not push to main in between.

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
        run: |
          curl -s -d "" \
            -H "X-workflow: ${GITHUB_WORKFLOW}" \
            -H "X-repo: ${GITHUB_REPOSITORY}" \
            -H "X-branch: ${GITHUB_REF_NAME}" \
            -H "X-sha: ${GITHUB_SHA:0:7}" \
            -H "X-run_id: ${GITHUB_RUN_ID}" \
            "${SLACK_NOTIFY_URL}?token=${SLACK_NOTIFY_TOKEN}&type=ci_failure&channel=alerts"
