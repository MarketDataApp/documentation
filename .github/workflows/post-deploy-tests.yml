name: "Docs: Post-Deploy Integration & E2E Tests"
run-name: "Docs: Post-Deploy Tests (${{ github.event.client_payload.environment || 'unknown' }})"

on:
  repository_dispatch:
    types: [deploy-complete]

jobs:
  test:
    runs-on: ubuntu-latest
    # Bounded so a hang reports rather than burning the runner. With no
    # `timeout-minutes` a job inherits GitHub's 360-minute default, and a
    # step that wedges on a network call takes six hours to say nothing.
    # Sized well above the observed maximum (about 2 minutes), because a cap that trips
    # on a slow-but-working run gets raised and then removed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.commit_sha }}

      # pnpm/action-setup MUST come before setup-node: `cache: pnpm` makes
      # setup-node run `pnpm store path`, which needs pnpm on PATH already.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This used to install worker/'s dependencies and run its integration
      # suite. The worker moved to MarketDataApp/www-marketdata-app, which runs
      # that suite plus a new smoke test after its own deploys. What remains
      # here is the half that tests THIS repo's content: the 19 redirects
      # declared in docusaurus.config.js.
      #
      # No install step -- `node --test` against the standard library and
      # global fetch. The root `pnpm install` above stays for the e2e run.
      # #185. This job fires on `deploy-complete`, but the orchestrator reports
      # success before Cloudflare has finished propagating -- measured at ~47s
      # once, upper bound unknown. Every suite below probes the live site, so
      # they all sit in that tail; the sitemap one probes 258 URLs and is the
      # widest surface of the three.
      #
      # The wait probes cache-busted on purpose. A warm probe is answered by the
      # PREVIOUS deployment's edge copy and would report ready before anything
      # propagated -- during #188 two deleted pages answered 200 that way for
      # 2.08 days.
      - name: Wait for the deploy to propagate
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: pnpm run wait:deploy

      - name: Run redirect tests
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: pnpm run test:redirects

      # The check #188 did not have. On production it fetches the deployed
      # sitemap and requires all ~258 URLs to answer 200; on staging, where a
      # noIndex build publishes no sitemap, it requires that there is none.
      #
      # This is the only gate here that reads what the public reads. The other
      # two -- scripts/lint-sitemap.js and the "Upload to R2" step's own
      # verification -- sit earlier in the chain and would both have passed
      # throughout #188, because the build was correct and the loss happened
      # after it.
      - name: Run sitemap tests
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: pnpm run test:sitemap

      # Safety net only. The suite prefers the browser already on the runner
      # (see scripts/resolve-chromium.js), so Chromium updates never wait on a
      # commit here and the runner downloads nothing it already has. This step
      # covers a runner image that ships without a browser.
      - name: Install Playwright Chromium, only when the runner has none
        run: node scripts/resolve-chromium.js || npx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: pnpm run test:e2e

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
        run: |
          curl -s -d "" \
            -H "X-workflow: ${GITHUB_WORKFLOW}" \
            -H "X-repo: ${GITHUB_REPOSITORY}" \
            -H "X-branch: ${GITHUB_REF_NAME}" \
            -H "X-sha: ${GITHUB_SHA:0:7}" \
            -H "X-run_id: ${GITHUB_RUN_ID}" \
            "${SLACK_NOTIFY_URL}?token=${SLACK_NOTIFY_TOKEN}&type=ci_failure&channel=alerts"
