name: "Docs: Post-Deploy Integration & E2E Tests"
run-name: "Docs: Post-Deploy Tests (${{ github.event.client_payload.environment || 'unknown' }})"

on:
  repository_dispatch:
    types: [deploy-complete]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # This used to install worker/'s dependencies and run its integration
      # suite. The worker moved to MarketDataApp/www-marketdata-app, which runs
      # that suite plus a new smoke test after its own deploys. What remains
      # here is the half that tests THIS repo's content: the 19 redirects
      # declared in docusaurus.config.js.
      #
      # No install step -- `node --test` against the standard library and
      # global fetch. The root `yarn install` above stays for the e2e run.
      - name: Run redirect tests
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: yarn test:redirects

      - run: npx playwright install chromium

      - name: Run e2e tests
        env:
          TEST_ENV: ${{ github.event.client_payload.environment }}
        run: yarn test:e2e

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
        run: |
          curl -s -d "" \
            -H "X-workflow: ${GITHUB_WORKFLOW}" \
            -H "X-repo: ${GITHUB_REPOSITORY}" \
            -H "X-branch: ${GITHUB_REF_NAME}" \
            -H "X-sha: ${GITHUB_SHA:0:7}" \
            -H "X-run_id: ${GITHUB_RUN_ID}" \
            "${SLACK_NOTIFY_URL}?token=${SLACK_NOTIFY_TOKEN}&type=ci_failure&channel=alerts"
