name: "Docs: PR Checks"

on:
  pull_request:
    branches: [main]

jobs:
  table-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check markdown table alignment
        run: node scripts/fix-table-alignment.js

  option-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # An expired option symbol breaks with the passage of time, not with a
      # diff, so review cannot catch it. Fails on any expired symbol anywhere
      # in the docs and warns 90 days ahead of the next expiration.
      - name: Check for expired option symbols
        run: node scripts/check-option-symbols.js

      - name: Unit-test the checker
        run: node --test scripts/__tests__/*.test.js

  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Builds with onBrokenLinks/onBrokenMarkdownLinks set to "throw". Deploys
      # build with "warn" so a bad link cannot block a release, which means this
      # PR check is the gate that keeps broken links off the site.
      #
      # PROD=true as well, purely so the build emits a sitemap for the next
      # step. @docusaurus/plugin-sitemap skips it whenever noIndex is set, and
      # noIndex is set on every non-production build -- so a staging build has
      # nothing to check. Nothing about broken-link detection changes.
      - name: Check for broken links
        run: yarn lint:links
        env:
          PROD: "true"

      # Reuses the build above rather than paying for a second one. The link
      # checker walks the pages; this walks the index of them, which nothing
      # else reads. See scripts/lint-sitemap.js for why that gap mattered.
      - name: Check the sitemap lists only pages this build serves
        run: node scripts/lint-sitemap.js

  # `worker-unit-tests` was here. The worker moved to
  # MarketDataApp/www-marketdata-app, which runs those 38 tests on its own pull
  # requests. Nothing is lost by deleting the job; keeping it would have run
  # tests against a directory this branch removes.

  # Job name kept, though it now runs only the redirect suite. Renaming it
  # would rename a status check, and a branch protection rule that requires the
  # old name would go on waiting for a job that no longer reports.
  staging-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step. This suite is `node --test` against the standard
      # library and global fetch, so it needs no dependencies -- it used to
      # borrow worker/'s vitest, and worker/ has gone. Same reason there is no
      # `cache: yarn` here any more: there is no lockfile to key it on.
      # #185: this job probes the LIVE staging site, which a merge to `staging`
      # takes through a ~5 minute deploy chain. A run landing inside that window
      # fails on pages that are mid-deploy, with a message identical to a broken
      # redirect -- and telling the two apart cost correlating timestamps across
      # two workflows in two repositories.
      #
      # This waits instead of retrying. A retry charges its delay to every
      # genuine failure forever, and automates the "it passed second time, must
      # be flake" reflex that #185 is about. The wait costs nothing when the
      # site is ready, and it never fails the job: on timeout it says what is
      # still down and lets the suites be the judges.
      - name: Wait for staging to finish deploying
        env:
          TEST_ENV: staging
        run: yarn wait:deploy

      - name: Run redirect tests against staging
        env:
          TEST_ENV: staging
        run: yarn test:redirects

      # On staging this asserts there is NO sitemap, which is the correct state
      # for a noIndex build and the thing that quietly changes if someone drops
      # noIndex. The live 200-probe half of this suite runs after the
      # production deploy, in post-deploy-tests.yml.
      - name: Run sitemap tests against staging
        env:
          TEST_ENV: staging
        run: yarn test:sitemap

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
        run: |
          curl -s -d "" \
            -H "X-workflow: ${GITHUB_WORKFLOW}" \
            -H "X-repo: ${GITHUB_REPOSITORY}" \
            -H "X-branch: ${GITHUB_REF_NAME}" \
            -H "X-sha: ${GITHUB_SHA:0:7}" \
            -H "X-run_id: ${GITHUB_RUN_ID}" \
            "${SLACK_NOTIFY_URL}?token=${SLACK_NOTIFY_TOKEN}&type=ci_failure&channel=alerts"

  staging-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: npx playwright install chromium

      # Same deploy race as the integration job above (#185). This suite drives
      # a real browser against the same host and can fail the same way; that it
      # has not yet is luck rather than design.
      - name: Wait for staging to finish deploying
        env:
          TEST_ENV: staging
        run: yarn wait:deploy

      - name: Run e2e tests against staging
        env:
          TEST_ENV: staging
        run: yarn test:e2e

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
        run: |
          curl -s -d "" \
            -H "X-workflow: ${GITHUB_WORKFLOW}" \
            -H "X-repo: ${GITHUB_REPOSITORY}" \
            -H "X-branch: ${GITHUB_REF_NAME}" \
            -H "X-sha: ${GITHUB_SHA:0:7}" \
            -H "X-run_id: ${GITHUB_RUN_ID}" \
            "${SLACK_NOTIFY_URL}?token=${SLACK_NOTIFY_TOKEN}&type=ci_failure&channel=alerts"
